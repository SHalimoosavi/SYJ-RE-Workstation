<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="t d"><title id="t">SYJ-RE-Workstation architecture</title><desc id="d">Terminal user runs Bash scripts. Bash calls external inspection tools. The tools produce local report files. GitHub Actions separately runs shell checks.</desc><rect width="960" height="240" rx="16" fill="#080e17" stroke="#244b65"/><text x="26" y="35" fill="#67e8f9" font-family="monospace" font-size="15">ARCHITECTURE FLOW</text><g fill="#102235" stroke="#38bdf8" stroke-width="2"><rect x="45" y="78" width="175" height="68" rx="10"/><rect x="285" y="78" width="175" height="68" rx="10"/><rect x="525" y="78" width="175" height="68" rx="10"/><rect x="755" y="78" width="165" height="68" rx="10"/></g><g fill="#e0f2fe" font-family="monospace" font-size="15" text-anchor="middle"><text x="132" y="118">Terminal user</text><text x="372" y="118">Bash scripts</text><text x="612" y="118">External tools</text><text x="837" y="118">Local reports</text></g><g fill="none" stroke="#38bdf8" stroke-width="3"><path d="M220 112h65m175 0h65m175 0h55" /></g><path d="M450 172h60" stroke="#67e8f9" stroke-width="2" stroke-dasharray="5 5"/><text x="480" y="198" fill="#9fb5c6" font-family="monospace" font-size="12" text-anchor="middle">GitHub Actions runs shell checks separately</text></svg>