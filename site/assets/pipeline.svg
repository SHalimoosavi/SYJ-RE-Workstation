<svg xmlns="http://www.w3.org/2000/svg" width="960" height="220" viewBox="0 0 960 220" role="img" aria-labelledby="t d"><title id="t">APK static inspection pipeline</title><desc id="d">Authorized APK input flows through file identification, SHA-256, AAPT metadata, permissions, manifest and archive inventory, then optional signature and JADX checks into local reports.</desc><rect width="960" height="220" rx="16" fill="#080e17" stroke="#244b65"/><text x="24" y="34" fill="#67e8f9" font-family="monospace" font-size="15">STATIC ANALYSIS PIPELINE</text><g font-family="monospace" font-size="12" text-anchor="middle" fill="#e0f2fe"><g fill="#102235" stroke="#38bdf8"><rect x="18" y="78" width="96" height="54" rx="8"/><rect x="132" y="78" width="96" height="54" rx="8"/><rect x="246" y="78" width="96" height="54" rx="8"/><rect x="360" y="78" width="96" height="54" rx="8"/><rect x="474" y="78" width="96" height="54" rx="8"/><rect x="588" y="78" width="96" height="54" rx="8"/><rect x="702" y="78" width="96" height="54" rx="8"/><rect x="816" y="78" width="126" height="54" rx="8"/></g><text x="66" y="110">APK input</text><text x="180" y="110">File + size</text><text x="294" y="110">SHA-256</text><text x="408" y="110">AAPT</text><text x="522" y="110">Permissions</text><text x="636" y="110">Manifest</text><text x="750" y="110">Archive</text><text x="879" y="102">Optional tools</text><text x="879" y="118">→ reports</text><g fill="none" stroke="#38bdf8" stroke-width="2"><path d="M114 105h18m96 0h18m96 0h18m96 0h18m96 0h18m96 0h18m96 0h18"/></g></g><text x="24" y="178" fill="#9fb5c6" font-family="monospace" font-size="12">apksigner and JADX run only when installed. No APK execution or runtime analysis.</text></svg>