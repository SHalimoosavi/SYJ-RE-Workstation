<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">APK analysis sequence</title><desc id="d">User supplies one APK path. Analyzer checks required commands, creates report directory, calls file, SHA-256, AAPT and unzip, optionally calls apksigner and JADX, saves evidence and prints the output directory.</desc><rect width="960" height="300" rx="16" fill="#080e17" stroke="#244b65"/><text x="26" y="34" fill="#67e8f9" font-family="monospace" font-size="15">ANALYSIS SEQUENCE</text><g fill="#102235" stroke="#38bdf8" stroke-width="1.5"><rect x="32" y="65" width="170" height="48" rx="8"/><rect x="260" y="65" width="170" height="48" rx="8"/><rect x="488" y="65" width="190" height="48" rx="8"/><rect x="736" y="65" width="190" height="48" rx="8"/><rect x="260" y="165" width="170" height="48" rx="8"/><rect x="488" y="165" width="190" height="48" rx="8"/></g><g fill="#e0f2fe" font-family="monospace" font-size="12" text-anchor="middle"><text x="117" y="94">User: APK path</text><text x="345" y="94">Check commands</text><text x="583" y="94">Create report folder</text><text x="831" y="94">Required tools</text><text x="345" y="194">Optional apksigner</text><text x="583" y="194">Optional JADX</text></g><g fill="none" stroke="#38bdf8" stroke-width="2"><path d="M202 89h58m170 0h58m190 0h58M831 113v30H345v22m85-46v46m58 24h-58"/></g><text x="26" y="258" fill="#9fb5c6" font-family="monospace" font-size="12">Required: file · sha256sum · aapt · unzip. Optional tool output is saved when available.</text></svg>