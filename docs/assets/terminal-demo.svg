<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc"><title id="title">Illustrative SYJ-RE-Workstation terminal session</title><desc id="desc">Animated terminal illustration showing repository setup and APK analysis. This is illustrative, not captured output.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#070b12"/><stop offset="1" stop-color="#101c2a"/></linearGradient></defs><rect width="960" height="360" rx="20" fill="url(#bg)" stroke="#24506b" stroke-width="2"/><rect x="1" y="1" width="958" height="48" rx="19" fill="#111e2b"/><circle cx="28" cy="25" r="6" fill="#38bdf8"/><circle cx="50" cy="25" r="6" fill="#3c6682"/><circle cx="72" cy="25" r="6" fill="#29465e"/><text x="105" y="31" fill="#8fb4ca" font-family="monospace" font-size="16" letter-spacing="2">SYJ-RE / TERMINAL — ILLUSTRATIVE DEMO</text><g font-family="ui-monospace,monospace" font-size="19" fill="#55c9ef"><text x="38" y="95">$ git clone https://github.com/SHalimoosavi/SYJ-RE-Workstation.git</text><text x="38" y="137">$ cd SYJ-RE-Workstation</text><text x="38" y="179">$ bash scripts/debian-bootstrap.sh</text><text x="38" y="221">$ bash scripts/analyze-apk.sh /path/to/authorized.apk</text></g><g fill="#8aa8bc" font-family="monospace" font-size="19"><text x="38" y="263">[1/8] File type and size</text><text x="38" y="293">[2/8] SHA-256</text><text x="38" y="323">[3/8] Package metadata</text></g><rect x="38" y="72" width="12" height="24" fill="#67e8f9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect><rect x="38" y="334" width="11" height="2" fill="#38bdf8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect></svg>