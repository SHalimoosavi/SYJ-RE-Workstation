name: Environment test report
description: Report a real test on Termux, Debian PRoot, Debian or Ubuntu
title: "test: "
labels: ["testing"]
body:
  - type: markdown
    attributes:
      value: |
        Report only a test you personally ran. Do not attach APKs, proprietary reports, credentials, personal paths or private device identifiers. Redact logs before submitting.
  - type: dropdown
    id: environment
    attributes:
      label: Environment tested
      options:
        - Termux (native)
        - Debian PRoot on Android
        - Debian
        - Ubuntu
        - Other
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / hardware
      description: Manufacturer and model, or "not applicable" for a hosted/container environment
      placeholder: Android phone model / PC / CI runner
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android version
      description: Required for Android/Termux reports; otherwise enter "not applicable"
      placeholder: Android 14
    validations:
      required: true
  - type: input
    id: architecture
    attributes:
      label: CPU architecture
      placeholder: aarch64, armv7l, x86_64
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Distribution and release
      placeholder: Debian 13 Trixie / Ubuntu 24.04 / Termux package environment
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Repository commit or release
      placeholder: git rev-parse HEAD
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Tool versions
      description: Include Bash, AAPT, file, unzip, apksigner, JADX and Java where installed. Write "unavailable" for missing optional tools.
      render: text
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: Commands executed
      description: Paste exact commands, including the test command.
      render: shell
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Overall result
      options:
        - Passed
        - Failed
        - Partially passed
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs and observations
      description: Include relevant output and failures. Remove usernames, home paths, APK names that identify private apps, tokens and other personal data.
      render: text
    validations:
      required: true
